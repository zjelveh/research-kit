# research-kit project config (spec §4.1). Every key is required except library and run_all.
paper_dir: paper
paper_branch: main
# languages: r and/or python, in the order their numbers scripts run. packages: {} when there is none.
languages: {{LANGUAGES}}
packages: {{PACKAGES}}
numbers_tex: paper/generated/numbers.tex
notation_tex: paper/generated/notation.tex
venue: undecided
lint:
  paper:
    globs: ["*.tex", "sections/**/*.tex"]   # root .tex files and any depth under sections/; generated/ and tables/ are excluded
    baseline: .lint_baseline
  slides:
    globs: ["slides/*/*.tex"]
    baseline: .lint_baseline_slides
# library: [analysis/R]   # optional: folders or files of shared code; default: the package
# run_all: [analysis/run_all.R]   # optional: the scripts that run the pipeline; default: files named run_all.R or run_all.py
